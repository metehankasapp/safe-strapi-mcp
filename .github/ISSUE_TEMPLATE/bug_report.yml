name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API tokens, environment files, or customer content.
  - type: input
    id: version
    attributes:
      label: Safe Strapi MCP version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Strapi and Node.js versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use synthetic schemas and content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
